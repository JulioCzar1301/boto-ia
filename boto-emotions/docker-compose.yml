services:
  emotion-api:
    build: .
    container_name: botolens-emotion-api
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=*
      - MAX_IMAGE_BASE64_CHARS=2500000
      - SESSION_TTL_SECONDS=300
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
